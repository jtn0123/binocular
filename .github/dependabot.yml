version: 2
updates:
  # Every action reference in .github/workflows is pinned to a commit SHA, which
  # means none of them pick up a patch on their own. This is what closes that
  # loop: dependabot rewrites the SHA and the trailing version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # github/codeql-action ships as four separate sub-actions - init,
    # autobuild, analyze and upload-sarif - and CodeQL fails unless every
    # step in a workflow is on the same version. One PR per sub-action can
    # therefore never go green. Group them so the family moves together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # These pairs enforce matching peer versions, so bumping one alone can never
    # pass npm ci. Group them so dependabot updates each pair in one PR.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      reanimated:
        patterns:
          - "react-native-reanimated"
          - "react-native-worklets"
    # Expo SDK 57 pins these, and the newer majors/minors are not supported yet:
    # TypeScript 7 breaks the lint parser, ESLint 10 breaks an Expo lint plugin,
    # and reanimated/worklets must match what the SDK ships. Revisit on the next
    # Expo SDK upgrade.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
