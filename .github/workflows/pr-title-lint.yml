name: PR Title Lint

# Enforces Conventional Commits on pull request titles.
#
# The title is what decides whether a merge cuts a version. On a squash merge
# it becomes the commit subject on main directly; on a merge commit it is what
# GitHub writes into the merge subject. Either way it is the line
# python-semantic-release parses (.github/workflows/release.yml), and a title
# that does not start with `feat:`, `fix:` or `perf:` — or carry a
# `BREAKING CHANGE:` footer — will not release.
#
# This surfaces that at PR time, while it is still one edit away, rather than
# as a warning on a run nobody reads after the merge has landed.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title matches Conventional Commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in step with pyproject.toml's
          # [tool.semantic_release.commit_parser_options].allowed_tags.
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[^A-Z].+$
          subjectPatternError: |
            The PR title subject "{subject}" should start with a lowercase
            letter (after the `type(scope):` prefix). For example:
              feat(map): page the wall the way the finger pointed
