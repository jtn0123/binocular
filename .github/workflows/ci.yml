name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, the same default release.yml already sets. Nothing here
# writes to the repository: the checks read the code, and the Sonar scan
# reports outward. Without this the job would inherit whatever the repository
# default is, which on a same-repo push is writable.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Only whether the token exists, never the token. A step cannot branch on
      # `secrets` directly, so something has to be readable at job scope — but
      # the secret itself at job scope is handed to `npm ci`, to every lint and
      # test process, and to any install script any dependency ships. The scan
      # is the only step that needs it, so it is the only step that gets it.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      # Pinned like the scan action below, and for the same reason. v4:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The token is only needed to clone. Left persisted it stays in the
          # local git config for every later step in the job, which is a
          # standing credential none of them asked for.
          persist-credentials: false
          # Sonar dates "new code" from the git history; a shallow clone makes
          # every line look new and the new-code gate meaningless.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Without this every run re-transforms the whole React Native + Expo
      # module graph through babel. React Native pulls modules in lazily, so
      # that cost lands inside the first render() of a suite — which is inside
      # a timed test — and ReviewScreen's first test blew jest's 5s default
      # while taking 323ms locally against a warm cache. Keyed on the lockfile
      # because that is what decides the transform output.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: jest-${{ runner.os }}-

      - run: npm run lint
      - run: npm run typecheck
      # The class of bug jest structurally cannot see: a worklet capturing an
      # ordinary function throws on the UI runtime, and release builds compile
      # out the guard that would catch it — so it aborts the process while the
      # whole test suite stays green. The check self-tests before it runs.
      - run: npm run audit:worklets
      # A GitHub runner has 2 cores; jest's default (cores - 1) still leaves
      # workers fighting, and each worker pays its own module-registry cost.
      - run: npm test -- --ci --coverage --cacheDirectory ~/.cache/jest --maxWorkers=2

      # Coverage is the whole reason this moved off Automatic Analysis, which
      # only ever sees the repository and so reported 0.0% forever.
      - name: SonarQube Cloud scan
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Pinned to a commit, not a tag. A tag is a moving pointer its owner
        # can repoint, and this is the one step the token is handed to — so
        # "whatever v8 means today" would be a standing decision, made by
        # someone else, about code that can read it. v8.2.1:
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
