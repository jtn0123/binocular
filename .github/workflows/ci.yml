name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Read once here so the scan step can ask whether it exists. A step
      # cannot branch on `secrets` directly, and on a pull request from a fork
      # it is empty — which should skip the scan, not fail the build.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar dates "new code" from the git history; a shallow clone makes
          # every line look new and the new-code gate meaningless.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Without this every run re-transforms the whole React Native + Expo
      # module graph through babel. React Native pulls modules in lazily, so
      # that cost lands inside the first render() of a suite — which is inside
      # a timed test — and ReviewScreen's first test blew jest's 5s default
      # while taking 323ms locally against a warm cache. Keyed on the lockfile
      # because that is what decides the transform output.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: jest-${{ runner.os }}-

      - run: npm run lint
      - run: npm run typecheck
      # The class of bug jest structurally cannot see: a worklet capturing an
      # ordinary function throws on the UI runtime, and release builds compile
      # out the guard that would catch it — so it aborts the process while the
      # whole test suite stays green. The check self-tests before it runs.
      - run: npm run audit:worklets
      # A GitHub runner has 2 cores; jest's default (cores - 1) still leaves
      # workers fighting, and each worker pays its own module-registry cost.
      - run: npm test -- --ci --coverage --cacheDirectory ~/.cache/jest --maxWorkers=2

      # Coverage is the whole reason this moved off Automatic Analysis, which
      # only ever sees the repository and so reported 0.0% forever.
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        # Pinned to a commit, not a tag. A tag is a moving pointer its owner
        # can repoint, and this step runs in a job that has SONAR_TOKEN in its
        # environment — so "whatever v8 means today" is a decision handed to
        # someone else about code that can read our secrets. v8.2.1:
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
