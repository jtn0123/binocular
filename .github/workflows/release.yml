name: Android APK

# Builds a standalone field-test APK and publishes it as a GitHub Release, so
# the phone in the workshop can be updated from anywhere — no laptop, no Metro,
# no cable. See docs/RELEASES.md for the install/update rules.
#
# The APK is signed with the React Native template debug keystore that
# `expo prebuild` generates (`android/app/debug.keystore`) — the same key that
# `npx expo run:android --variant release` uses locally. Identical key +
# identical applicationId is exactly what lets Android install a new build
# *over* the old one and keep its database. Do not change the signing key
# without reading docs/RELEASES.md § Changing the signing key first.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU architectures to build for'
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - arm64-v8a,armeabi-v7a
          - armeabi-v7a,arm64-v8a,x86,x86_64
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        type: boolean
        default: true
  # Release-pipeline changes get build-tested before they are merged; PR runs
  # upload an artifact and publish nothing.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/ci/**'
      - 'plugins/**'
      - 'app.json'
      - 'package-lock.json'

# Least privilege by default. Only the publish job — which never runs for a
# pull request — is granted write, so the job that builds PR code cannot
# write to the repository even on a same-repo PR where the token would
# otherwise be writable.
permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      tag: ${{ steps.build.outputs.tag }}
      apk: ${{ steps.build.outputs.apk }}
      abis: ${{ steps.build.outputs.abis }}
      version_name: ${{ steps.build.outputs.version_name }}
      size: ${{ steps.apk.outputs.size }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The build needs the code, not the ability to push it.
          persist-credentials: false

      # ExecuTorch's native build fills the runner: the first APK containing it
      # finished, then failed to save either cache with "No space left on
      # device" — which silently makes every subsequent build a cold 20-minute
      # one. Reclaiming the preinstalled toolchains this project never touches
      # buys ~25 GB. Deliberately does NOT touch the Android SDK or NDK, which
      # the native build very much does need.
      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
                      /usr/local/share/chromium /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free disk: ${before}G -> ${after}G"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # matches plugins/withGradleDaemonJvm.js (JDK 24+ breaks AGP)

      - uses: android-actions/setup-android@v3
        with:
          # The default package set includes the obsolete "tools" package,
          # which drags in the Android emulator — half a gigabyte downloaded
          # on every run for something a headless APK build never launches.
          # Gradle fetches the platform and build-tools it actually needs.
          packages: ''

      # Gradle re-executed all 956 tasks on every run because this cached only
      # ~/.gradle/caches — downloaded *dependencies*, not task outputs. With
      # org.gradle.caching on (plugins/withBuildPerformance.js) those outputs
      # land in ~/.gradle/caches/build-cache-1, inside the path below.
      #
      # The key must be unique per run: actions/cache skips saving entirely on
      # an exact key hit ("Cache hit occurred on the primary key … not saving
      # cache"), so a fixed key would restore an empty build cache and then
      # discard everything the run just computed, forever.
      # Split deliberately. Caching all of ~/.gradle/caches under a run-id key
      # wrote a 2.27 GB entry on EVERY run — 40s to restore, 50s to save, and
      # against GitHub's 10 GB per-repo quota only about four builds fit before
      # eviction started throwing away the npm and jest caches too.
      #
      # Downloaded dependencies are large and change only with the lockfile, so
      # they get a stable key and are written once. Task outputs are what the
      # run actually computes, so they keep the run-id suffix: actions/cache
      # skips saving on an exact key hit, and a fixed key there would restore
      # an empty build cache and discard the run's work forever.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}
          restore-keys: gradle-deps-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}-${{ github.run_id }}
          restore-keys: |
            gradle-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}-
            gradle-build-${{ runner.os }}-

      - run: npm ci

      # A release APK should never ship from red code; this is the same gate
      # ci.yml applies to main, run again here because tags can point anywhere.
      - run: npm run typecheck
      - run: npm test -- --ci

      - name: Work out this build's identity
        id: build
        env:
          ABIS: ${{ inputs.abis || 'arm64-v8a' }}
        run: |
          set -euo pipefail
          # versionCode must increase for every build the phone might install.
          # The 1000 offset keeps CI builds unambiguously above any local
          # `expo run:android --variant release` build (which is always 1).
          version_code=$(( 1000 + GITHUB_RUN_NUMBER ))
          base=$(node -p "require('./app.json').expo.version")

          if [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
            version_name="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
          else
            version_name="${base}+ci.${GITHUB_RUN_NUMBER}"
            tag="build-${GITHUB_RUN_NUMBER}"
          fi

          # '+' is legal in a versionName but awkward in a filename/URL.
          apk="binocular-${version_name//+/-}-vc${version_code}.apk"

          {
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "tag=${tag}"
            echo "apk=${apk}"
            echo "abis=${ABIS}"
          } >> "$GITHUB_OUTPUT"

          echo "Building ${apk} (versionName ${version_name}, versionCode ${version_code}, ABIs ${ABIS})"

      - name: Stamp version into app.json
        env:
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
        run: node scripts/ci/stamp-app-version.mjs

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      # Workflow expressions are passed through `env:` rather than pasted into
      # the shell body: an expression is substituted as text before bash sees
      # it, so interpolating one directly is how a value ends up executed
      # instead of used. These values are workflow-controlled, but the habit
      # is what keeps it that way.
      - name: Assemble release APK
        working-directory: android
        env:
          ABIS: ${{ steps.build.outputs.abis }}
        run: ./gradlew assembleRelease "-PreactNativeArchitectures=$ABIS"

      - name: Collect the APK
        id: apk
        env:
          APK: ${{ steps.build.outputs.apk }}
        run: |
          set -euo pipefail
          src=android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp "$src" "dist/$APK"
          size=$(du -h "dist/$APK" | cut -f1)
          echo "size=${size}" >> "$GITHUB_OUTPUT"
          echo "### 📦 $APK (${size})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.apk }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    # Never for a pull request: the PR path build-tests the pipeline and
    # publishes nothing.
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes list the commits since the last release

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}
          path: dist

      - name: Write release notes
        env:
          TAG: ${{ needs.build.outputs.tag }}
          APK: ${{ needs.build.outputs.apk }}
          SIZE: ${{ needs.build.outputs.size }}
          ABIS: ${{ needs.build.outputs.abis }}
        run: |
          set -euo pipefail
          previous=$(git tag --list 'v*' 'build-*' --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)
          {
            echo "**${APK}** · ${SIZE} · \`${ABIS}\` · commit \`${GITHUB_SHA:0:7}\`"
            echo
            echo "### Install on the phone"
            echo
            echo "1. Open this page on the phone and download the \`.apk\` below."
            echo "2. Tap the download and allow your browser to install unknown apps if asked."
            echo "3. Tap **Update** — do *not* uninstall first. Your bins, items and photos are kept."
            echo
            echo "Same signing key and same package as the previous build, so this installs"
            echo "in place. Full rules — and what to do if Android refuses the install — are"
            echo "in [docs/RELEASES.md](../blob/main/docs/RELEASES.md)."
            echo
            echo "### Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "${previous}..HEAD" | head -50
            else
              git log --no-merges --pretty='- %s' -20
            fi
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          APK: ${{ needs.build.outputs.apk }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "dist/$APK" \
            --target "$GITHUB_SHA" \
            --title "Binocular $VERSION_NAME" \
            --notes-file release-notes.md \
            $PRERELEASE
          echo "Released: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
