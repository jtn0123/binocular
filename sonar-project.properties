# SonarQube Cloud, analysed from CI rather than automatically.
#
# Automatic Analysis cannot read a coverage report — it only ever sees the
# repository — which is why "Coverage on New Code" read 0.0% while the suite
# was covering most of what it measures. Coverage is the one signal here worth
# having, so the scan runs in CI off the lcov jest already knows how to write.
#
# The two must not both be on: SonarQube rejects a CI analysis while Automatic
# Analysis is enabled for the project.
sonar.projectKey=jtn0123_binocular
sonar.organization=jtn0123

sonar.sources=app,src
sonar.tests=app,src
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
